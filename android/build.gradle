buildscript {
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }

        dependencies {
            classpath("com.android.tools.build:gradle:8.12.0")
            classpath("com.facebook.react:react-native-gradle-plugin:0.86.0")
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

def safeExtGet(prop, fallback) {
    if (rootProject.ext.has(prop)) {
        return rootProject.ext.get(prop)
    }

    rootProject.hasProperty(prop) ? rootProject.property(prop) : fallback
}

// Follow the host app's compileSdk by default, so a module built into an app on
// compileSdk 37 is not silently left behind on 36. TelematicsSdk_compileSdkVersion
// still wins when set, for apps that need to pin this module specifically.
def telematicsCompileSdk = safeExtGet(
    'TelematicsSdk_compileSdkVersion',
    safeExtGet('compileSdkVersion', 36)
).toString().toInteger()

android {
    namespace "com.reactnativetelematicssdk"
    compileSdk telematicsCompileSdk
    defaultConfig {
        minSdk safeExtGet('TelematicsSdk_minSdkVersion', 24)
        targetSdk safeExtGet('TelematicsSdk_targetSdkVersion', 36)
        versionCode 3
        versionName "1.0"

        def isNewArchEnabled = (project.findProperty("newArchEnabled") ?: "false").toString().toBoolean()
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchEnabled.toString()
        }

    packaging {
        resources {
            excludes += [
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        disable.add('GradleCompatible')
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

// com.telematicssdk:tracking:4.1.0 declares minCompileSdk=37 in its AAR metadata, so
// AGP refuses it on compileSdk 36 by default. That declaration comes from the compileSdk
// Damoov happened to build the AAR with, NOT from anything the AAR actually needs:
// its highest transitive requirement is 36 (androidx.activity 1.13.0), its bytecode
// references no class added in API 37, and its resources stop at values-v31. Android SDK
// Platform 37 is preview-channel only, which cannot be installed on EAS/CI workers, so
// requiring it makes remote Android builds impossible.
//
// Telling AGP to skip the AAR metadata compileSdk check lets the whole thing build on
// stable compileSdk 36 -- verified by building example/ as debug AND release.
if (telematicsCompileSdk < 36) {
    throw new GradleException(
        "react-native-telematics requires compileSdk 36 or higher. " +
        "Set TelematicsSdk_compileSdkVersion (or the app compileSdk) to 36 or higher."
    )
}

if (telematicsCompileSdk < 37 &&
    !((rootProject.findProperty('android.experimental.disableCompileSdkChecks') ?: 'false').toString().toBoolean())) {
    throw new GradleException(
        "react-native-telematics builds on compileSdk ${telematicsCompileSdk}, but " +
        "com.telematicssdk:tracking:4.1.0 declares minCompileSdk=37 in its AAR metadata. " +
        "Add this line to your app's android/gradle.properties:\n\n" +
        "    android.experimental.disableCompileSdkChecks=true\n\n" +
        "That skips the AAR metadata compileSdk check. The SDK does not use any API 37 " +
        "class or resource, so compileSdk 36 is enough; requiring 37 would force the " +
        "preview-channel Android SDK Platform 37, which cannot be installed on EAS/CI " +
        "workers. The Expo config plugin sets this property for you. Alternatively set " +
        "compileSdk to 37 (and android.suppressUnsupportedCompileSdk=37.0)."
    )
}

// com.telematicssdk:tracking:4.1.0 ships Kotlin metadata 2.3.0. React Native pins the
// Kotlin Gradle Plugin well below that (2.1.20 on 0.83/0.85/0.86), so bare (non-Expo)
// integrators must override KGP on the root buildscript classpath. This is only a WARNING,
// not a hard failure: Expo apps correctly stay on an older KGP that Expo itself pins (it
// compiles its own modules with that exact compiler), and instead work around the metadata
// mismatch with `-Xskip-metadata-version-check` on the Kotlin compile tasks -- which is
// exactly what com.telematicssdk's Expo config plugin adds automatically. A hard failure
// here would be a false positive for every Expo app. Do the check lazily (after the root
// project's buildscript is fully configured) and never let the check itself break the
// build if the version can't be determined.
gradle.projectsEvaluated {
    def parseVersion = { String raw ->
        def m = (raw =~ /^(\d+)\.(\d+)(?:\.(\d+))?/)
        m ? [m[0][1] as int, m[0][2] as int, (m[0][3] ?: "0") as int] : null
    }

    try {
        def kgpVersion = rootProject.buildscript.configurations.findByName("classpath")
            ?.allDependencies
            ?.find { it.group == "org.jetbrains.kotlin" && it.name == "kotlin-gradle-plugin" }
            ?.version

        // Null means this build does not declare KGP on the root buildscript classpath
        // (for example the included React Native Gradle build). Nothing to verify there.
        if (kgpVersion != null) {
            def actual = parseVersion(kgpVersion)
            def required = [2, 3, 0]

            if (actual != null && (
                actual[0] < required[0] ||
                (actual[0] == required[0] && actual[1] < required[1])
            )) {
                logger.warn(
                    "[react-native-telematics] com.telematicssdk:tracking:4.1.0 ships Kotlin metadata 2.3.0. " +
                    "Kotlin Gradle Plugin ${kgpVersion} on the root buildscript classpath cannot read it as-is. " +
                    "This is expected and harmless on Expo apps using '-Xskip-metadata-version-check' " +
                    "(added automatically by this package's Expo config plugin). If this is a bare " +
                    "(non-Expo) React Native app, set kotlin-gradle-plugin to 2.3.21 on the ROOT " +
                    "buildscript classpath instead. If you are on Expo and still see a build failure, " +
                    "add '-Xskip-metadata-version-check' to your Kotlin compile tasks manually. See README."
                )
            }
        }
    } catch (Throwable ignored) {
        // The Kotlin Gradle Plugin version could not be determined in this configuration.
        // Skip the check rather than failing the build: a check that itself crashes is
        // worse than no check.
    }
}

repositories {
    maven {
        url "https://s3.us-east-2.amazonaws.com/android.telematics.sdk.production/"
    }
}

dependencies {
    //noinspection GradleDynamicVersion
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation("com.facebook.react:react-android")
    implementation("com.telematicssdk:tracking:4.1.0")
}
